databaseChangeLog:
  - changeSet:
      id: 001-create-saga-transactions
      author: atlas-bank
      changes:
        - createTable:
            tableName: saga_transactions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: state
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: from_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: to_account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: char(3)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_saga_transactions_state
            tableName: saga_transactions
            columns:
              - column:
                  name: state
